  <style>

    .industry-row span { display:block; margin-top:3px; color:var(--muted); font-size:12px; }
    table { width:100%; min-width:760px; border-collapse:collapse; }
    th,td { border-bottom:1px solid #263645; border-right:1px solid #263645; padding:8px 9px; vertical-align:top; white-space:nowrap; }
    th { position:sticky; top:0; z-index:5; background:#1b2835; color:#c9d7e3; }
    td b { display:block; font-weight:700; }
    td small { display:block; opacity:.72; margin-top:3px; color:var(--muted); }
    .rank-no { width:54px; text-align:center; color:var(--muted); }
    .up { color:var(--red); }
    .empty { color:#526575; text-align:center; }
    @media (max-width:900px) {
      .app { grid-template-columns:1fr; min-height:auto; }
      .body { height:auto; max-height:none; }
      .head { align-items:stretch; flex-direction:column; }
    }
  </style>

const DATES=["20260430","20260506","20260507","20260508","20260511","20260512","20260513","20260514","20260515","20260518","20260519","20260520","20260521","20260522","20260525","20260526","20260527","20260528","20260529","20260601"];
let selectedDate=DATES[DATES.length-1]||"";
let selectedIndustry="";
const dateSelect=document.getElementById("dateSelect");
const industryList=document.getElementById("industryList");
const filterInput=document.getElementById("filterInput");
const industryTitle=document.getElementById("industryTitle");
const tableWrap=document.getElementById("tableWrap");
function fmtDate(d){return d?d.slice(4,6)+"-"+d.slice(6,8):"-";}
function rowsByDate(d){return DATA.filter(r=>r.d===d);}
function industries(d){
  const map=new Map();
  for(const r of rowsByDate(d)) if(!map.has(r.ic)) map.set(r.ic,r);
  return [...map.values()].sort((a,b)=>(a.ir??9999)-(b.ir??9999));
}
function stockRows(d,ic){return rowsByDate(d).filter(r=>r.ic===ic).sort((a,b)=>(a.sr??9999)-(b.sr??9999));}
function renderDates(){
  dateSelect.innerHTML=DATES.map(d=>`<option value="${d}">${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}</option>`).join("");
  dateSelect.value=selectedDate;
}
function renderIndustries(){
  const q=filterInput.value.trim().toLowerCase();
  const list=industries(selectedDate).filter(r=>!q||r.in.toLowerCase().includes(q)||r.ic.includes(q));
  if(!selectedIndustry||!list.some(r=>r.ic===selectedIndustry)) selectedIndustry=list[0]?.ic||"";
  industryList.innerHTML=list.map(r=>`<button class="industry-row ${r.ic===selectedIndustry?"active":""}" data-code="${r.ic}">
    <strong class="up">${r.ir}. ${r.in}</strong>
    <span>${r.ic}</span>
  </button>`).join("")||`<div class="muted">暂无匹配板块</div>`;
  industryList.querySelectorAll(".industry-row").forEach(btn=>btn.addEventListener("click",()=>{selectedIndustry=btn.dataset.code;renderIndustries();renderStocks();}));
}
function renderStocks(){
  const ind=industries(selectedDate).find(r=>r.ic===selectedIndustry);
  if(!ind){industryTitle.textContent="请选择板块";tableWrap.innerHTML="";return;}
  industryTitle.textContent=`${ind.ir}. ${ind.in}｜${ind.ic}`;
  const ds=DATES.slice(Math.max(0,DATES.indexOf(selectedDate)-9),DATES.indexOf(selectedDate)+1);
  const maxRank=Math.max(1,...ds.flatMap(d=>stockRows(d,selectedIndustry).map(r=>Number(r.sr)||0)));
  let html=`<table><thead><tr><th>身位</th>${ds.map(d=>`<th>${fmtDate(d)}</th>`).join("")}</tr></thead><tbody>`;
  for(let rank=1;rank<=Math.min(maxRank,15);rank++){
    html+=`<tr><td class="rank-no">${rank}</td>`;
    for(const d of ds){
      const r=stockRows(d,selectedIndustry).find(x=>Number(x.sr)===rank);
      html+=r?`<td><b>${r.n}</b><small>${r.s}</small></td>`:`<td class="empty">-</td>`;
    }
    html+=`</tr>`;
  }
  html+=`</tbody></table>`;
  tableWrap.innerHTML=html;
}
function renderAll(){renderDates();renderIndustries();renderStocks();}
dateSelect.addEventListener("change",()=>{selectedDate=dateSelect.value;selectedIndustry="";renderAll();});
filterInput.addEventListener("input",()=>{selectedIndustry="";renderIndustries();renderStocks();});
renderAll();
</script>
