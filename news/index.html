<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Static Board Viewer</title>
  <style>
    :root { color-scheme: dark; --bg:#0f131a; --panel:#171c25; --panel2:#101720; --line:#2a3240; --line2:#364154; --ink:#edf2f8; --muted:#9ca8bb; --red:#ff5a5f; --green:#52d39a; --blue:#76b7ff; }
    * { box-sizing:border-box; }
    .public-banner { margin:8px 10px 0; padding:7px 10px; border:1px solid #364154; border-radius:6px; color:#9ca8bb; background:#101720; }
    body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.5 "Microsoft YaHei", Arial, sans-serif; }
    .app { display:grid; grid-template-columns:330px minmax(720px,1fr); gap:10px; height:100vh; padding:10px; }
    .pane { border:1px solid var(--line); background:var(--panel); border-radius:8px; overflow:hidden; min-width:0; }
    .head { min-height:74px; padding:8px 10px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .body { height:calc(100% - 74px); overflow-y:auto; overflow-x:hidden; padding:10px; }
    select,input { border:1px solid var(--line2); background:#101720; color:var(--ink); border-radius:6px; padding:6px 8px; }
    .muted { color:var(--muted); }
    .industry-list { display:flex; flex-direction:column; gap:6px; }
    .industry-row { width:100%; text-align:left; border:1px solid rgba(54,65,84,.78); background:#111923; color:var(--ink); border-radius:6px; padding:8px 9px; cursor:pointer; }
    .industry-row:hover,.industry-row.active { border-color:var(--blue); background:#1a2635; }
    .industry-row.favorite { border-color:rgba(255,90,95,.45); }
    .industry-row.growth-board { border-color:#ffd84d; background:linear-gradient(90deg, rgba(255,216,77,.34), rgba(255,216,77,.13) 52%, #111923 100%); box-shadow:inset 7px 0 0 #ffd84d, 0 0 18px rgba(255,216,77,.28); }
    .industry-row.growth-board.active { border-color:#ffe66d; background:linear-gradient(90deg, rgba(255,216,77,.44), rgba(255,216,77,.18) 56%, #1a2635 100%); box-shadow:inset 8px 0 0 #ffe66d, 0 0 24px rgba(255,216,77,.38); }
    .industry-row strong { display:block; font-size:14px; }
    .industry-row span { display:block; margin-top:3px; color:var(--muted); font-size:12px; }
    .fav-controls { display:flex; gap:6px; align-items:center; margin-bottom:8px; }
    .mini-btn { border:1px solid var(--line2); background:#101720; color:var(--ink); border-radius:6px; padding:5px 8px; cursor:pointer; }
    .mini-btn:hover,.mini-btn.active { border-color:var(--red); background:#261a23; color:#fff; }
    .fav-star { float:right; margin-left:8px; color:#6d7786; font-size:16px; cursor:pointer; user-select:none; }
    .fav-star.on { color:#ffcf5a; text-shadow:0 0 8px rgba(255,207,90,.35); }
    .new-badge { display:inline-block; margin-right:5px; padding:1px 6px; border-radius:5px; background:var(--red); color:#fff; font-weight:800; box-shadow:0 0 0 1px rgba(255,255,255,.18) inset; }
    .growth-highlight { color:#ffe66d!important; text-shadow:0 0 12px rgba(255,216,77,.45); }
    .growth-title { color:#ffe66d!important; text-shadow:0 0 10px rgba(255,216,77,.28); }
    .growth-chip { display:inline-block; margin-left:8px; padding:1px 6px; border-radius:5px; border:1px solid rgba(255,216,77,.42); color:#ffd84d; background:rgba(255,216,77,.08); font-size:12px; font-weight:700; }
    .up { color:var(--red)!important; }
    .down { color:var(--green)!important; }
    .flat { color:var(--ink)!important; }
    .calm-cell { color:var(--ink)!important; }
    .stable-watch { color:var(--red)!important; background:rgba(255,77,95,.10); box-shadow:inset 0 0 0 1px rgba(255,77,95,.55); }
    .stock-selected { outline:2px solid #a879ff; outline-offset:-3px; background:rgba(168,121,255,.13)!important; }
    .toolbar { display:flex; flex-direction:column; gap:5px; align-items:flex-end; min-width:220px; }
    .title-box { min-width:0; flex:1; }
    .title-box strong { font-size:18px; display:block; white-space:normal; overflow-wrap:anywhere; }
    .title-meta { margin-left:8px; color:var(--muted); font-size:12px; font-weight:400; }
    #industryNote { width:100%; height:32px; }
    .table-wrap { max-width:100%; overflow:auto; height:calc(100vh - 286px); border:1px solid rgba(54,65,84,.55); border-radius:6px; }
    .cycle-gain { margin-top:10px; border-top:1px solid var(--line); padding-top:10px; }
    .gain-dashboard { display:grid; grid-template-columns:minmax(330px,42%) minmax(0,58%); gap:10px; align-items:start; }
    .gain-rank-grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px; }
    .gain-list { display:flex; flex-wrap:wrap; gap:6px; }
    .gain-chip { min-width:0; border:1px solid rgba(54,65,84,.78); border-radius:6px; background:#111923; padding:5px 7px; color:var(--ink); text-decoration:none; overflow:hidden; }
    .gain-chip b { color:var(--red); }
    .gain-chip small { display:block; color:var(--muted); margin-top:2px; }
    .leader-chart { border:1px solid rgba(54,65,84,.78); border-radius:6px; background:#111923; padding:8px; overflow-x:auto; overflow-y:hidden; min-height:236px; }
    .leader-chart svg { height:230px; display:block; max-width:none; }
    table { width:100%; min-width:860px; border-collapse:collapse; }
    th,td { border-bottom:1px solid #263645; border-right:1px solid #263645; padding:8px 9px; vertical-align:top; white-space:nowrap; }
    th { position:sticky; top:0; z-index:5; background:#1b2835; color:#c9d7e3; }
    td b { display:block; font-weight:700; }
    td small { display:block; opacity:.78; margin-top:3px; color:currentColor; }
    .stock-link { color:inherit; text-decoration:none; }
    .stock-link:hover { color:var(--blue); text-decoration:underline; }
    .rank-no { width:54px; text-align:center; color:var(--muted); }
    .empty { text-align:center; color:#526575; }
    .result-panel { margin:8px 0; border:1px solid var(--line); border-radius:6px; background:#111923; padding:8px; display:none; }
    .result-panel h2 { margin:0 0 6px; font-size:14px; }
    .result-item { border-top:1px solid #263645; padding:7px 0; cursor:pointer; }
    .result-item:first-of-type { border-top:0; }
    .result-item b { color:var(--red); }
    .result-item small { display:block; color:var(--muted); margin-top:2px; }
    .gain-dashboard { display:grid; grid-template-columns:minmax(320px,0.92fr) minmax(420px,1.08fr); gap:10px; align-items:start; }
    .gain-rank-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
    .gain-rank-chip { border:1px solid rgba(54,65,84,.78); border-radius:6px; background:#111923; padding:6px 7px; color:var(--ink); min-width:0; }
    .gain-rank-chip b { display:block; color:var(--red); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .gain-rank-chip small { display:block; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .leader-chart { border:1px solid rgba(54,65,84,.78); border-radius:6px; background:#111923; padding:8px; overflow:auto; }
    .leader-chart svg { width:100%; min-width:440px; height:230px; display:block; }
    @media (max-width:1100px) { .gain-dashboard { grid-template-columns:1fr; } }
    @media (max-width:720px) { .app { grid-template-columns:1fr; height:auto; } .pane { min-height:420px; } .table-wrap { height:auto; } .head { align-items:stretch; flex-direction:column; } .toolbar { width:100%; align-items:stretch; } .gain-dashboard { grid-template-columns:1fr; } .gain-rank-grid { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  </style>
</head>
<body>

  <div class="public-banner">Static snapshot for lightweight viewing.</div>
<div class="app">
  <section class="pane">
    <div class="head">
      <strong>板块</strong>
      <select id="dateSelect"></select>
    </div>
    <div class="body">
      <input id="filterInput" style="width:100%;margin-bottom:8px" placeholder="筛选板块 / 股票" />
      <div class="fav-controls">
        <button id="favoriteOnlyBtn" class="mini-btn" type="button">只看收藏</button>
        <span id="favoriteCount" class="muted"></span>
      </div>
      <div class="muted" style="margin-bottom:8px">红色：排名上升或新出现；绿色：排名下跌；白色：不变。</div>
      <div id="searchPanel" class="result-panel"></div>
        <div id="industryList" class="industry-list"></div>
    </div>
  </section>
  <section class="pane">
    <div class="head">
      <div class="title-box">
        <strong id="industryTitle">请选择板块</strong>
        <input id="industryNote" placeholder="板块备注" />
      </div>
      <div class="toolbar">
        <span class="muted">身位</span>
        <button id="calmModeBtn" class="mini-btn" type="button">&#21482;&#30475;&#19981;&#24369;</button>
        <span id="selectedStockHint" class="muted"></span>
        <span class="muted">生成：2026-08-20 20:30:09</span>
      </div>
    </div>
    <div class="body">
      <div id="ladderWrap" class="table-wrap"></div>
      <div id="gainPanel" class="cycle-gain"></div>
    </div>
  </section>
</div>

const FAVORITE_FILTER_KEY = "leader_strategy_show_favorites_only_v1";
let selectedDate = "20260820";
let selectedIndustry = "";
let notes = loadNotes();
let favorites = loadFavorites();
let showFavoritesOnly = localStorage.getItem(FAVORITE_FILTER_KEY) === "1";
let selectedStockSymbol = "";
let calmMode = false;

const dateSelect = document.getElementById("dateSelect");
const industryList = document.getElementById("industryList");
const filterInput = document.getElementById("filterInput");
const favoriteOnlyBtn = document.getElementById("favoriteOnlyBtn");
const favoriteCount = document.getElementById("favoriteCount");
const searchPanel = document.getElementById("searchPanel");
const industryTitle = document.getElementById("industryTitle");
const industryNote = document.getElementById("industryNote");
const ladderWrap = document.getElementById("ladderWrap");
const gainPanel = document.getElementById("gainPanel");
const calmModeBtn = document.getElementById("calmModeBtn");
const selectedStockHint = document.getElementById("selectedStockHint");

function loadNotes() { try { return JSON.parse(localStorage.getItem(NOTE_KEY) || "{}"); } catch (_) { return {}; } }
function saveNotes() { localStorage.setItem(NOTE_KEY, JSON.stringify(notes)); }
function loadFavorites() {
  try { return new Set(JSON.parse(localStorage.getItem(FAVORITE_KEY) || "[]")); }
  catch (_) { return new Set(); }
}
function saveFavorites() { localStorage.setItem(FAVORITE_KEY, JSON.stringify([...favorites])); }
function isFavorite(code) { return favorites.has(String(code)); }
function toggleFavorite(code) {
  code = String(code || "");
  if (!code) return;
  if (favorites.has(code)) favorites.delete(code); else favorites.add(code);
  saveFavorites();
}
function noteKey() { return `${selectedDate}|${selectedIndustry}`; }
function fmtDate(d) { return d ? d.slice(4,6) + "-" + d.slice(6,8) : "-"; }
function queryHref(symbol) { return '#'; }
function clsByMove(nowRank, prevRank) {
  if (prevRank == null) return "up";
  if (nowRank < prevRank) return "up";
  if (nowRank > prevRank) return "down";
  return "flat";
}
function rowsByDate(date) { return DATA.filter(r => r.date === date); }
function uniqueIndustries(date) {
  const map = new Map();
  for (const r of rowsByDate(date)) {
    if (!r.showIndustry) continue;
    if (!map.has(r.industryCode)) map.set(r.industryCode, r);
  }
  return [...map.values()].sort((a,b) => a.industryRank - b.industryRank);
}
function prevDateOf(date) { const idx = DATES.indexOf(date); return idx > 0 ? DATES[idx - 1] : null; }
function windowDates(date) {
  const endIdx = DATES.indexOf(date);
  if (RIGHT_WINDOW_DAYS > 0) {
    return endIdx < 0 ? [] : DATES.slice(Math.max(0, endIdx - RIGHT_WINDOW_DAYS + 1), endIdx + 1);
  }
  const ind = rowsByDate(date).find(r => r.industryCode === selectedIndustry && r.showIndustry);
  if (!ind || !ind.cycleStartDate) { const idx = DATES.indexOf(date); return DATES.slice(Math.max(0, idx - 9), idx + 1); }
  const startIdx = DATES.indexOf(ind.cycleStartDate);
  if (endIdx < 0) { const idx = DATES.indexOf(date); return DATES.slice(Math.max(0, idx - 9), idx + 1); }
  if (startIdx < 0) return DATES.slice(0, endIdx + 1);
  return DATES.slice(startIdx, endIdx + 1);
}
function cycleDatesFor(date, code) {
  const endIdx = DATES.indexOf(date);
  if (RIGHT_WINDOW_DAYS > 0) {
    return endIdx < 0 ? [] : DATES.slice(Math.max(0, endIdx - RIGHT_WINDOW_DAYS + 1), endIdx + 1);
  }
  const ind = rowsByDate(date).find(r => r.industryCode === code && r.showIndustry) || rowsByDate(date).find(r => r.industryCode === code);
  if (!ind || !ind.cycleStartDate) { const idx = DATES.indexOf(date); return DATES.slice(Math.max(0, idx - 9), idx + 1); }
  const startIdx = DATES.indexOf(ind.cycleStartDate);
  if (endIdx < 0) { const idx = DATES.indexOf(date); return DATES.slice(Math.max(0, idx - 9), idx + 1); }
  if (startIdx < 0) return DATES.slice(0, endIdx + 1);
  return DATES.slice(startIdx, endIdx + 1);
}
function gainLeaderFor(date, code) {
  const currentRows = rowsByDate(date).filter(x => x.industryCode === code);
  const currentStrong = new Set(currentRows.map(x => x.symbol));
  if (!currentStrong.size) return null;
  const symbols = new Map();
  for (const d of cycleDatesFor(date, code)) {
    for (const r of rowsByDate(d).filter(x => x.industryCode === code)) {
      if (!currentStrong.has(r.symbol)) continue;
      if (!symbols.has(r.symbol)) symbols.set(r.symbol, { symbol:r.symbol, name:r.name, rows:[], stockGrowth:false });
      const item = symbols.get(r.symbol);
      const current = currentRows.find(x => x.symbol === r.symbol);
      item.stockGrowth = Boolean(current && current.stockGrowth);
      if (Number.isFinite(r.close) && Number.isFinite(r.industryClose)) item.rows.push(r);
    }
  }
  const gains = [...symbols.values()].map(x => {
    x.rows.sort((a,b) => DATES.indexOf(a.date) - DATES.indexOf(b.date));
    const first = x.rows[0], last = x.rows[x.rows.length - 1];
    if (!first || !last || first.close <= 0 || first.industryClose <= 0) return null;
    const stockGain = last.close / first.close - 1;
    const industryGain = last.industryClose / first.industryClose - 1;
    return { ...x, relGain:(stockGain - industryGain) * 100 };
  }).filter(Boolean).sort((a,b) => b.relGain - a.relGain);
  return gains[0] || null;
}
function industryGrowthByGainLeader(ind) {
  const leader = gainLeaderFor(selectedDate, ind.industryCode);
  return Boolean(leader && leader.stockGrowth);
}
function industryGrowthSummaryByGainLeader(ind) {
  const leader = gainLeaderFor(selectedDate, ind.industryCode);
  return leader && leader.stockGrowth ? `｜业绩 涨幅第一增长：${leader.name}` : "";
}

function stockMatches(date,q){
  if(!q)return [];
  const seen=new Set(), key=q.toLowerCase(), out=[];
  for(const r of rowsByDate(date)){
    const hit=String(r.name||"").toLowerCase().includes(key)||String(r.symbol||"").includes(key);
    if(!hit)continue;
    const id=`${r.industryCode}|${r.symbol}|${r.stockRank}`;
    if(seen.has(id))continue;
    seen.add(id);
    out.push(r);
  }
  return out.sort((a,b)=>(a.industryRank??9999)-(b.industryRank??9999)||(a.stockRank??9999)-(b.stockRank??9999));
}
function renderSearchResults(matches,q){
  if(!q){searchPanel.style.display="none";searchPanel.innerHTML="";return;}
  searchPanel.style.display="block";
  if(!matches.length){searchPanel.innerHTML=`<h2>股票查询</h2><div class="muted">当前日期未命中：${q}</div>`;return;}
  searchPanel.innerHTML=`<h2>股票查询｜${matches.length} 条</h2>`+matches.slice(0,30).map(r=>`<div class="result-item" data-code="${r.industryCode}">
    <b>${r.name} ${r.symbol}</b>
    <small>${r.industryRank}. ${r.industryName}｜${r.industryCode}｜身位 ${r.stockRank}</small>
  </div>`).join("");
  searchPanel.querySelectorAll(".result-item").forEach(item=>item.addEventListener("click",()=>{selectedIndustry=item.dataset.code;renderIndustries();renderStocks();}));
}

function previousIndustryRank(code, date) {
  const prev = prevDateOf(date);
  if (!prev) return null;
  const r = rowsByDate(prev).find(x => x.industryCode === code && x.showIndustry);
  return r ? r.industryRank : null;
}
function previousStockRank(code, symbol, date) {
  const prev = prevDateOf(date);
  if (!prev) return null;
  const r = rowsByDate(prev).find(x => x.industryCode === code && x.symbol === symbol);
  return r ? r.stockRank : null;
}
function stockRankOn(code, symbol, date) {
  const r = rowsByDate(date).find(x => x.industryCode === code && x.symbol === symbol);
  return r ? r.stockRank : null;
}
function noWeakStreak(code, symbol, date) {
  let streak = 0;
  let curDate = date;
  while (true) {
    const prev = prevDateOf(curDate);
    if (!prev) break;
    const curRank = stockRankOn(code, symbol, curDate);
    const prevRank = stockRankOn(code, symbol, prev);
    if (curRank == null || prevRank == null || curRank > prevRank) break;
    streak += 1;
    curDate = prev;
  }
  return streak;
}
function industrySummary(ind) {
  const growth = industryGrowthSummaryByGainLeader(ind);
  return `${ind.industryCode}｜周期 ${ind.cycleStartDate || "-"} → ${selectedDate}｜行业领涨 ${ind.industryScore}｜原分 ${ind.industryRawScore}｜5日相对 ${ind.industryRel5}%｜强势股 ${ind.industryStrongCount}/${ind.industryTotalCount} (${ind.strongShareInIndustry}%)｜占强势板块 ${ind.strongShareInStrongBoards}%${growth}`;
}
function renderDates() {
  dateSelect.innerHTML = DATES.map(d => `<option value="${d}">${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}</option>`).join("");
  dateSelect.value = selectedDate;
}
function renderIndustries() {
  const q = filterInput.value.trim().toLowerCase();
  const matches = stockMatches(selectedDate, q);
  renderSearchResults(matches, q);
  const list = uniqueIndustries(selectedDate).filter(r => !q || r.industryName.toLowerCase().includes(q) || r.industryCode.includes(q) || matches.some(m => m.industryCode === r.industryCode));
  if (!selectedIndustry || !list.some(r => r.industryCode === selectedIndustry)) selectedIndustry = list[0]?.industryCode || "";
  industryList.innerHTML = list.map(r => {
    const prevRank = previousIndustryRank(r.industryCode, selectedDate);
    const cls = clsByMove(r.industryRank, prevRank);
    const move = prevRank == null ? "新" : `${prevRank}→${r.industryRank}`;
    const badge = prevRank == null ? '<span class="industry-new-badge">新</span>' : '';
    const growthBoard = industryGrowthByGainLeader(r);
    return `<button class="industry-row ${selectedIndustry === r.industryCode ? "active" : ""}" data-code="${r.industryCode}">
      <strong class="${cls} ${growthBoard ? "growth-highlight" : ""}">${badge}${r.industryRank}. ${r.industryName}</strong>
      <span>${r.industryCode}｜${move}｜领涨 ${r.industryScore}｜5日相对 ${r.industryRel5}%</span>
      <span>强势股 ${r.industryStrongCount}/${r.industryTotalCount}（${r.strongShareInIndustry}%）｜占强势板块 ${r.strongShareInStrongBoards}%</span>
    </button>`;
  }).join("");
  industryList.querySelectorAll(".industry-row").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedIndustry = btn.dataset.code;
      selectedStockSymbol = "";
      renderIndustries();
      renderStocks();
    });
  });
}
function cellFor(date, code, rank) {
  const r = rowsByDate(date).find(x => x.industryCode === code && x.stockRank === rank);
  if (!r) return `<td class="empty">-</td>`;
  const prevRank = previousStockRank(code, r.symbol, date);
  const stable = date === selectedDate && noWeakStreak(code, r.symbol, date) >= 2;
  const cls = [
    calmMode ? "calm-cell" : clsByMove(r.stockRank, prevRank),
    calmMode && stable ? "stable-watch" : "",
    selectedStockSymbol && selectedStockSymbol === r.symbol ? "stock-selected" : ""
  ].filter(Boolean).join(" ");
  const mark = prevRank == null ? '<span class="new-badge">&#26032;</span>' : "";
  const stableMark = calmMode && stable ? '<span class="new-badge">&#19981;&#24369;</span>' : "";
  return `<td class="${cls}" data-symbol="${r.symbol}" data-name="${r.name}"><b><a class="stock-link" href="#">${mark}${stableMark}${r.name}</a></b><small>${r.stockScore}&#xff5c;${r.symbol}</small></td>`;
}
function renderStocks() {
  const ind = rowsByDate(selectedDate).find(r => r.industryCode === selectedIndustry && r.showIndustry);
  if (!ind) {
    industryTitle.textContent = "请选择板块";
    industryNote.value = "";
    ladderWrap.innerHTML = "";
    gainPanel.innerHTML = "";
    selectedStockHint.textContent = "";
    return;
  }
  const ds = windowDates(selectedDate);
  const titleGrowth = industryGrowthByGainLeader(ind);
  industryTitle.innerHTML = `<span class="${titleGrowth ? "growth-title" : ""}">${ind.industryRank}. ${ind.industryName}</span><span class="title-meta">${industrySummary(ind)}</span>`;
  industryNote.value = notes[noteKey()] || "";
  let html = `<table><thead><tr><th>排名</th>${ds.map(d => `<th>${fmtDate(d)}</th>`).join("")}</tr></thead><tbody>`;
  for (let rank = 1; rank <= STOCK_TOP; rank++) {
    html += `<tr><td class="rank-no">${rank}</td>${ds.map(d => cellFor(d, selectedIndustry, rank)).join("")}</tr>`;
  }
  html += `</tbody></table>`;
  ladderWrap.innerHTML = html;
  ladderWrap.querySelectorAll("td[data-symbol]").forEach(td => {
    td.addEventListener("click", (ev) => {
      if (ev.target && ev.target.closest("a")) return;
      const symbol = td.dataset.symbol || "";
      selectedStockSymbol = selectedStockSymbol === symbol ? "" : symbol;
      renderStocks();
    });
  });
  const selectedRow = selectedStockSymbol ? rowsByDate(selectedDate).find(x => x.industryCode === selectedIndustry && x.symbol === selectedStockSymbol) : null;
  selectedStockHint.textContent = selectedRow ? `已标记：${selectedRow.name}` : "";
  calmModeBtn.classList.toggle("active", calmMode);
  gainPanel.innerHTML = renderCycleGain(selectedIndustry, ds);
}
function renderLeadershipChart(code, ds) {
  const points = ds.map(d => {
    const rows = rowsByDate(d).filter(x => x.industryCode === code);
    const ind = rows.find(x => x.showIndustry) || rows[0];
    if (!ind || !Number.isFinite(ind.industryRank)) return null;
    const leader = rows.slice().sort((a,b) => (a.stockRank || 999) - (b.stockRank || 999))[0];
    return { date:d, rank:ind.industryRank, leaderName:leader ? leader.name : "", leaderSymbol:leader ? leader.symbol : "" };
  }).filter(Boolean);
  if (!points.length) return `<div class="leader-chart"><div class="muted">暂无身位数据</div></div>`;
  const w = Math.max(520, Math.ceil(points.length / 10) * 520), h = 230, padL = 38, padR = 20, padT = 22, padB = 42;
  const maxRank = Math.max(30, ...points.map(p => p.rank));
  const x = i => padL + (points.length === 1 ? 0 : i * (w - padL - padR) / (points.length - 1));
  const y = rank => padT + (rank - 1) * (h - padT - padB) / Math.max(1, maxRank - 1);
  const segs = points.slice(1).map((p,i) => {
    const a = points[i], color = (a.rank <= 10 || p.rank <= 10) ? "#ff4d5f" : "#66788c";
    return `<line x1="${x(i).toFixed(1)}" y1="${y(a.rank).toFixed(1)}" x2="${x(i+1).toFixed(1)}" y2="${y(p.rank).toFixed(1)}" stroke="${color}" stroke-width="2.4" />`;
  }).join("");
  let lastLeader = "";
  const nodes = points.map((p,i) => {
    const changed = p.leaderSymbol && p.leaderSymbol !== lastLeader;
    if (p.leaderSymbol) lastLeader = p.leaderSymbol;
    const color = changed ? "#2bd47d" : (p.rank <= 10 ? "#ff4d5f" : "#7b8b9e");
    const label = changed ? `<text x="${x(i).toFixed(1)}" y="${Math.max(12, y(p.rank)-9).toFixed(1)}" text-anchor="middle" fill="#2bd47d" font-size="10">${p.leaderName}</text>` : "";
    return `${label}<circle cx="${x(i).toFixed(1)}" cy="${y(p.rank).toFixed(1)}" r="${changed ? 4.6 : 3.4}" fill="${color}"><title>Static Board Viewer</title></circle>`;
  }).join("");
  const labels = points.map((p,i) => `<text x="${x(i).toFixed(1)}" y="${h-13}" text-anchor="middle" fill="#8b9bad" font-size="10">${fmtDate(p.date)}</text>`).join("");
  return `<div class="leader-chart"><div class="muted" style="margin-bottom:6px">板块身位与龙头切换</div><svg viewBox="0 0 ${w} ${h}" style="width:${w}px" role="img">
    <line x1="${padL}" y1="${y(10).toFixed(1)}" x2="${w-padR}" y2="${y(10).toFixed(1)}" stroke="#ff4d5f" stroke-width="1" stroke-dasharray="4 5" opacity=".65" />
    <text x="8" y="${y(10).toFixed(1)}" fill="#ff8b98" font-size="10">前10</text>
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="#314253" />
    <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="#314253" />
    ${segs}${nodes}${labels}
  </svg></div>`;
}
function renderCycleGain(code, ds) {
  if (!ds.length) return "";
  const currentStrong = new Set(rowsByDate(selectedDate).filter(x => x.industryCode === code).map(x => x.symbol));
  if (!currentStrong.size) return "";
  const symbols = new Map();
  for (const d of ds) {
    for (const r of rowsByDate(d).filter(x => x.industryCode === code)) {
      if (!currentStrong.has(r.symbol)) continue;
      if (!symbols.has(r.symbol)) symbols.set(r.symbol, { symbol:r.symbol, name:r.name, rows:[] });
      const item = symbols.get(r.symbol);
      if (Number.isFinite(r.close) && Number.isFinite(r.industryClose)) item.rows.push(r);
    }
  }
  const gains = [...symbols.values()].map(x => {
    x.rows.sort((a,b) => DATES.indexOf(a.date) - DATES.indexOf(b.date));
    const first = x.rows[0], last = x.rows[x.rows.length - 1];
    if (!first || !last || first.close <= 0 || first.industryClose <= 0) return null;
    const stockGain = last.close / first.close - 1;
    const industryGain = last.industryClose / first.industryClose - 1;
    return { ...x, firstDate:first.date, lastDate:last.date, relGain:(stockGain - industryGain) * 100, stockGain:stockGain * 100, industryGain:industryGain * 100 };
  }).filter(Boolean).sort((a,b) => b.relGain - a.relGain);
  if (!gains.length) return "";
  const rankList = `<div><div class="muted" style="margin-bottom:6px">周期内当前强势股相对板块涨幅排名</div><div class="gain-rank-grid">` +
    gains.map((x, i) => `<a class="gain-chip" href="#">${i+1}. <span class="${(rowsByDate(selectedDate).find(r => r.symbol === x.symbol && r.industryCode === code) || {}).stockGrowth ? "growth-highlight" : ""}">${x.name}</span> <b>${x.relGain.toFixed(1)}%</b><small>${fmtDate(x.firstDate)}→${fmtDate(x.lastDate)}｜个股 ${x.stockGain.toFixed(1)}%｜板块 ${x.industryGain.toFixed(1)}%</small></a>`).join("") +
    `</div></div>`;
  return `<div class="gain-dashboard">${rankList}${renderLeadershipChart(code, ds)}</div>`;
}

function stockRowsFor(date,code){
  return rowsByDate(date).filter(r=>r.industryCode===code).sort((a,b)=>(a.stockRank??9999)-(b.stockRank??9999));
}
function renderLeadershipChart(code, ds){
  const points = ds.map((d,i)=>{
    const ind = rowsByDate(d).find(x=>x.industryCode===code && x.showIndustry) || rowsByDate(d).find(x=>x.industryCode===code);
    const leader = stockRowsFor(d,code).find(x=>Number(x.stockRank)===1);
    return ind && Number.isFinite(ind.industryRank) ? {date:d, rank:Number(ind.industryRank), leader, index:i} : null;
  }).filter(Boolean);
  if(!points.length)return `<div class="leader-chart"><div class="muted">暂无身位数据</div></div>`;
  const w=560,h=230,pad=34;
  const maxRank=Math.max(20,...points.map(p=>p.rank));
  const xOf=i=>points.length<=1?w/2:pad+i*(w-2*pad)/(points.length-1);
  const yOf=rank=>pad+(rank-1)*(h-2*pad)/Math.max(1,maxRank-1);
  const segs=points.slice(1).map((p,i)=>{
    const a=points[i], hot=a.rank<=10&&p.rank<=10;
    return `<line x1="${xOf(i).toFixed(1)}" y1="${yOf(a.rank).toFixed(1)}" x2="${xOf(i+1).toFixed(1)}" y2="${yOf(p.rank).toFixed(1)}" stroke="${hot?'#ff5a5f':'#526575'}" stroke-width="${hot?2.6:1.4}" opacity="${hot?0.95:0.55}"/>`;
  }).join("");
  let lastLeader="";
  const marks=points.map((p,i)=>{
    const x=xOf(i), y=yOf(p.rank), hot=p.rank<=10;
    const leader=p.leader?.name||"";
    const changed=leader && leader!==lastLeader;
    if(leader)lastLeader=leader;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${hot?4.5:3.2}" fill="${hot?'#ff5a5f':'#526575'}"/>`+
      `<text x="${x.toFixed(1)}" y="${(y-9).toFixed(1)}" text-anchor="middle" fill="${hot?'#ffb2b5':'#7f8da3'}" font-size="10">${p.rank}</text>`+
      (changed?`<text x="${x.toFixed(1)}" y="${Math.min(h-10,y+18).toFixed(1)}" text-anchor="middle" fill="#52d39a" font-size="10">${leader}</text>`:"");
  }).join("");
  const labels=points.map((p,i)=>`<text x="${xOf(i).toFixed(1)}" y="${h-4}" text-anchor="middle" fill="#9ca8bb" font-size="10">${fmtDate(p.date)}</text>`).join("");
  return `<div class="leader-chart"><div class="muted" style="margin-bottom:6px">板块身位与龙头切换</div><svg viewBox="0 0 ${w} ${h}" role="img">
    <line x1="${pad}" y1="${yOf(10).toFixed(1)}" x2="${w-pad}" y2="${yOf(10).toFixed(1)}" stroke="#ff5a5f" stroke-dasharray="5 5" opacity=".45"/>
    <text x="${pad}" y="${(yOf(10)-5).toFixed(1)}" fill="#ff8e91" font-size="10">前10</text>
    ${segs}${marks}${labels}
  </svg></div>`;
}

      if(Number.isFinite(r.close)&&Number.isFinite(r.industryClose))symbols.get(r.symbol).rows.push(r);
    }
  }
  const gains=[...symbols.values()].map(x=>{
    x.rows.sort((a,b)=>DATES.indexOf(a.date)-DATES.indexOf(b.date));
    const first=x.rows[0],last=x.rows[x.rows.length-1];
    if(!first||!last||first.close<=0||first.industryClose<=0)return null;
    const stockGain=last.close/first.close-1, industryGain=last.industryClose/first.industryClose-1;
    return {...x,firstDate:first.date,lastDate:last.date,relGain:(stockGain-industryGain)*100,stockGain:stockGain*100,industryGain:industryGain*100};
  }).filter(Boolean).sort((a,b)=>b.relGain-a.relGain);
  const left=gains.length?`<div><div class="muted" style="margin-bottom:6px">周期内当前强势股相对板块涨幅排名</div><div class="gain-rank-grid">`+
    gains.map((x,i)=>`<span class="gain-rank-chip"><b>${i+1}. ${x.name}</b><small>${x.relGain.toFixed(1)}%｜${fmtDate(x.firstDate)}→${fmtDate(x.lastDate)}</small></span>`).join("")+`</div></div>`:
    `<div class="muted">暂无涨幅排名</div>`;
  return `<div class="gain-dashboard">${left}${renderLeadershipChart(code,ds)}</div>`;
}

function renderIndustriesWithFavorites() {
  const q = filterInput.value.trim().toLowerCase();
  const matches = stockMatches(selectedDate, q);
  renderSearchResults(matches, q);
  let list = uniqueIndustries(selectedDate).filter(r => !q || r.industryName.toLowerCase().includes(q) || r.industryCode.includes(q) || matches.some(m => m.industryCode === r.industryCode));
  if (showFavoritesOnly) list = list.filter(r => isFavorite(r.industryCode));
  if (!selectedIndustry || !list.some(r => r.industryCode === selectedIndustry)) selectedIndustry = list[0]?.industryCode || "";
  favoriteOnlyBtn.classList.toggle("active", showFavoritesOnly);
  favoriteCount.textContent = `收藏 ${favorites.size}`;
  if (!list.length) {
    industryList.innerHTML = `<div class="muted" style="padding:10px;border:1px dashed var(--line2);border-radius:6px">暂无匹配板块。可以先关闭“只看收藏”，再点星标收录。</div>`;
    return;
  }
  industryList.innerHTML = list.map(r => {
    const prevRank = previousIndustryRank(r.industryCode, selectedDate);
    const cls = clsByMove(r.industryRank, prevRank);
    const move = prevRank == null ? "新" : `${prevRank}→${r.industryRank}`;
    const badge = prevRank == null ? '<span class="industry-new-badge">新</span>' : '';
    const growthBoard = industryGrowthByGainLeader(r);
    const fav = isFavorite(r.industryCode);
    return `<button class="industry-row ${selectedIndustry === r.industryCode ? "active" : ""} ${fav ? "favorite" : ""} ${growthBoard ? "growth-board" : ""}" data-code="${r.industryCode}">
      <strong class="${cls} ${growthBoard ? "growth-highlight" : ""}">${badge}${r.industryRank}. ${r.industryName}<span class="fav-star ${fav ? "on" : ""}" data-fav="${r.industryCode}" title="${fav ? "取消收藏" : "收藏板块"}">★</span></strong>
      <span>${r.industryCode}｜${move}｜领涨 ${r.industryScore}｜5日相对 ${r.industryRel5}%</span>
      <span>强势股 ${r.industryStrongCount}/${r.industryTotalCount}（${r.strongShareInIndustry}%）｜占强势板块 ${r.strongShareInStrongBoards}%</span>
    </button>`;
  }).join("");
  industryList.querySelectorAll(".fav-star").forEach(star => {
    star.addEventListener("click", (event) => {
      event.stopPropagation();
      toggleFavorite(star.dataset.fav);
      renderIndustries();
      renderStocks();
    });
  });
  industryList.querySelectorAll(".industry-row").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedIndustry = btn.dataset.code;
      selectedStockSymbol = "";
      renderIndustries();
      renderStocks();
    });
  });
}
renderIndustries = renderIndustriesWithFavorites;
function renderAll() { renderDates(); renderIndustries(); renderStocks(); }
dateSelect.addEventListener("change", () => { selectedDate = dateSelect.value; selectedIndustry = ""; selectedStockSymbol = ""; renderAll(); });
filterInput.addEventListener("input", () => { selectedIndustry = ""; selectedStockSymbol = ""; renderIndustries(); renderStocks(); });
favoriteOnlyBtn.addEventListener("click", () => {
  showFavoritesOnly = !showFavoritesOnly;
  localStorage.setItem(FAVORITE_FILTER_KEY, showFavoritesOnly ? "1" : "0");
  selectedIndustry = "";
  selectedStockSymbol = "";
  renderIndustries();
  renderStocks();
});
calmModeBtn.addEventListener("click", () => {
  calmMode = !calmMode;
  renderStocks();
});
industryNote.addEventListener("input", () => { if (!selectedIndustry) return; notes[noteKey()] = industryNote.value; saveNotes(); });
renderAll();
</script>
</body>
</html>
