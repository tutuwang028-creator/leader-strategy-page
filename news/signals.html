let mode = 'leaderStrategy';
const dateSel = document.getElementById('date');
const dates = Object.keys(PAYLOAD).sort().reverse();

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmt(v,type) { if (v === null || v === undefined || v === '') return '-'; if (type === 'pct') { const n = Number(v); return Number.isNaN(n) ? '-' : (n>=0?'+':'') + n.toFixed(2) + '%'; } if (type === 'number') { const n = Number(v); return Number.isNaN(n) ? '-' : n.toFixed(2).replace(/\.00$/,''); } return String(v); }
function nameCell(r,c) { const badge = r.is_new_signal ? '<span class="new-badge">新</span>' : ''; const cls = r.stock_growth ? ' class="growth-highlight"' : ''; return `<span class="name-cell">${badge}<strong${cls}>${esc(fmt(r[c.key],c.type))}</strong></span>`; }
function table(rows, cols) {
  if (!rows.length) return '<div class="empty">没有命中。</div>';
  return `<table><thead><tr>${cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>` +
    rows.map(r => `<tr>${cols.map(c=>`<td>${c.key==='name'?nameCell(r,c):esc(fmt(r[c.key],c.type))}</td>`).join('')}</tr>`).join('') +
    '</tbody></table>';
}
function render() {

}
