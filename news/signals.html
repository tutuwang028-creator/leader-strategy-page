function nameCell(r,c) { const badge = r.is_new_signal ? '<span class="new-badge">新</span>' : ''; const cls = r.stock_growth ? ' class="growth-highlight"' : ''; return `<span class="name-cell">${badge}<strong${cls}>${esc(fmt(r[c.key],c.type))}</strong></span>`; }
function table(rows, cols) {
  if (!rows.length) return '<div class="empty">没有命中。</div>';
  return `<table><thead><tr>${cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>` +
    rows.map(r => `<tr>${cols.map(c=>`<td>${c.key==='name'?nameCell(r,c):esc(fmt(r[c.key],c.type))}</td>`).join('')}</tr>`).join('') +
    '</tbody></table>';
}
function render() {
  const d = dateSel.value || dates[0];
  const rows = (PAYLOAD[d] || {})[mode] || [];
  const cols = mode === 'leaderStrategy' ? LEADER_COLUMNS : THEME_COLUMNS;
  document.getElementById('summary').textContent = `${d} · ${mode === 'leaderStrategy' ? '龙头战法' : '题材战法'} · ${rows.length} 只`;
  document.getElementById('content').innerHTML = table(rows, cols);
  document.getElementById('leaderBtn').classList.toggle('active', mode === 'leaderStrategy');
  document.getElementById('themeBtn').classList.toggle('active', mode === 'themeStrategy');
}
dateSel.onchange = render;
document.getElementById('leaderBtn').onclick = () => { mode='leaderStrategy'; render(); };
document.getElementById('themeBtn').onclick = () => { mode='themeStrategy'; render(); };
render();
</script>
</body>
</html>
