  <style>

    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.5 "Microsoft YaHei", Arial, sans-serif; }
    .page { min-height:100vh; padding:10px; }
    .top { position:sticky; top:0; z-index:10; margin:-10px -10px 8px; padding:10px; background:rgba(15,19,26,.96); border-bottom:1px solid var(--line); backdrop-filter:blur(8px); }
    .bar { display:flex; gap:8px; align-items:center; }
    .bar select,.bar input { min-width:0; border:1px solid var(--line2); background:#101720; color:var(--ink); border-radius:6px; padding:7px 8px; }
    .bar select { width:132px; }
    .bar input { flex:1; }
    .tabs { display:flex; gap:7px; overflow-x:auto; padding:9px 0 2px; scrollbar-width:none; }
    .tabs::-webkit-scrollbar { display:none; }
    .tab { flex:0 0 auto; max-width:190px; border:1px solid rgba(54,65,84,.88); background:#111923; color:var(--ink); border-radius:8px; padding:7px 9px; text-align:left; }
    .tab.active { border-color:var(--blue); background:#1a2635; }
    .tab b { display:block; max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tab small { display:block; color:var(--muted); margin-top:2px; }
    .summary { border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:9px 10px; margin-bottom:8px; }
    .summary h1 { font-size:17px; margin:0 0 5px; }
    .summary p { margin:0; color:var(--muted); font-size:12px; }
    .table-wrap { border:1px solid var(--line); border-radius:8px; background:var(--panel); overflow:auto; }
    table { width:100%; min-width:760px; border-collapse:collapse; }
    th,td { border-bottom:1px solid #263645; border-right:1px solid #263645; padding:8px 9px; vertical-align:top; white-space:nowrap; }
    th { position:sticky; top:0; z-index:4; background:#1b2835; color:#c9d7e3; }
    .rank-no { position:sticky; left:0; z-index:3; width:52px; text-align:center; color:var(--muted); background:#141b24; }
    th.rank-no { z-index:5; background:#1b2835; }
    td b { display:block; font-weight:700; }
    td small { display:block; color:var(--muted); margin-top:2px; }
    .up { color:var(--red); }
    .down { color:var(--green); }
    .flat { color:var(--ink); }
    .empty { color:#526575; text-align:center; }
    .hint { color:var(--muted); padding:14px; text-align:center; }
    .result-panel { margin-top:8px; border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:8px; display:none; }
    .result-panel h2 { margin:0 0 6px; font-size:14px; }
    .result-item { border-top:1px solid #263645; padding:7px 0; }
    .result-item:first-of-type { border-top:0; }
    .result-item b { color:var(--red); }
    .result-item small { display:block; color:var(--muted); margin-top:2px; }
    .leader-chart { margin-top:8px; border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:8px; overflow:auto; }
    .leader-chart svg { width:100%; min-width:520px; height:230px; display:block; }
  </style>
</head>

    const hit=String(r.name||"").toLowerCase().includes(key)||String(r.symbol||"").includes(key);
    if(!hit)continue;
    const id=`${r.industryCode}|${r.symbol}|${r.stockRank}`;
    if(seen.has(id))continue;
    seen.add(id);
    out.push(r);
  }
  return out.sort((a,b)=>(a.industryRank??9999)-(b.industryRank??9999)||(a.stockRank??9999)-(b.stockRank??9999));
}
function renderSearchResults(matches,q){
  if(!q){searchPanel.style.display="none";searchPanel.innerHTML="";return;}
  searchPanel.style.display="block";
  if(!matches.length){searchPanel.innerHTML=`<h2>股票查询</h2><div class="hint">当前日期未命中：${q}</div>`;return;}
  searchPanel.innerHTML=`<h2>股票查询｜${matches.length} 条</h2>`+matches.slice(0,30).map(r=>`<div class="result-item" data-code="${r.industryCode}">
    <b>${r.name} ${r.symbol}</b>
    <small>${r.industryRank}. ${r.industryName}｜${r.industryCode}｜身位 ${r.stockRank}</small>
  </div>`).join("");
  searchPanel.querySelectorAll(".result-item").forEach(item=>item.addEventListener("click",()=>{selectedIndustry=item.dataset.code;renderTabs();renderTable();}));
}
function previousIndustryRank(code,date){const p=prevDateOf(date);if(!p)return null;const r=rowsByDate(p).find(x=>x.industryCode===code&&x.showIndustry);return r?r.industryRank:null;}
function previousStockRank(code,symbol,date){const p=prevDateOf(date);if(!p)return null;const r=rowsByDate(p).find(x=>x.industryCode===code&&x.symbol===symbol);return r?r.stockRank:null;}
function windowDates(date){const i=DATES.indexOf(date);return DATES.slice(Math.max(0,i-9),i+1);}
function stockRowsFor(date,code){return rowsByDate(date).filter(r=>r.industryCode===code).sort((a,b)=>(a.stockRank??9999)-(b.stockRank??9999));}
function renderLeadershipChart(code,ds){
  const points=ds.map((d,i)=>{
    const ind=rowsByDate(d).find(x=>x.industryCode===code&&x.showIndustry)||rowsByDate(d).find(x=>x.industryCode===code);
    const leader=stockRowsFor(d,code).find(x=>Number(x.stockRank)===1);
    return ind&&Number.isFinite(ind.industryRank)?{date:d,rank:Number(ind.industryRank),leader,index:i}:null;
  }).filter(Boolean);
  if(!points.length)return `<div class="leader-chart"><div class="muted">暂无身位数据</div></div>`;
  const w=560,h=230,pad=34,maxRank=Math.max(20,...points.map(p=>p.rank));
  const xOf=i=>points.length<=1?w/2:pad+i*(w-2*pad)/(points.length-1);
  const yOf=rank=>pad+(rank-1)*(h-2*pad)/Math.max(1,maxRank-1);
  const segs=points.slice(1).map((p,i)=>{
    const a=points[i],hot=a.rank<=10&&p.rank<=10;
    return `<line x1="${xOf(i).toFixed(1)}" y1="${yOf(a.rank).toFixed(1)}" x2="${xOf(i+1).toFixed(1)}" y2="${yOf(p.rank).toFixed(1)}" stroke="${hot?'#ff5a5f':'#526575'}" stroke-width="${hot?2.6:1.4}" opacity="${hot?0.95:0.55}"/>`;
  }).join("");
  let lastLeader="";
  const marks=points.map((p,i)=>{
    const x=xOf(i),y=yOf(p.rank),hot=p.rank<=10,leader=p.leader?.name||"",changed=leader&&leader!==lastLeader;
    if(leader)lastLeader=leader;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${hot?4.5:3.2}" fill="${hot?'#ff5a5f':'#526575'}"/>`+
      `<text x="${x.toFixed(1)}" y="${(y-9).toFixed(1)}" text-anchor="middle" fill="${hot?'#ffb2b5':'#7f8da3'}" font-size="10">${p.rank}</text>`+
      (changed?`<text x="${x.toFixed(1)}" y="${Math.min(h-10,y+18).toFixed(1)}" text-anchor="middle" fill="#52d39a" font-size="10">${leader}</text>`:"");
  }).join("");
  const labels=points.map((p,i)=>`<text x="${xOf(i).toFixed(1)}" y="${h-4}" text-anchor="middle" fill="#9ca8bb" font-size="10">${fmtDate(p.date)}</text>`).join("");
  return `<div class="leader-chart"><div class="muted" style="margin-bottom:6px">板块身位与龙头切换</div><svg viewBox="0 0 ${w} ${h}" role="img">
    <line x1="${pad}" y1="${yOf(10).toFixed(1)}" x2="${w-pad}" y2="${yOf(10).toFixed(1)}" stroke="#ff5a5f" stroke-dasharray="5 5" opacity=".45"/>
    <text x="${pad}" y="${(yOf(10)-5).toFixed(1)}" fill="#ff8e91" font-size="10">前10</text>
    ${segs}${marks}${labels}
  </svg></div>`;
}
function renderDates(){dateSelect.innerHTML=DATES.map(d=>`<option value="${d}">${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}</option>`).join("");dateSelect.value=selectedDate;}
function renderTabs(){
  const q=filterInput.value.trim().toLowerCase();
  const matches=stockMatches(selectedDate,q);
  renderSearchResults(matches,q);
  const list=industries(selectedDate).filter(r=>!q||r.industryName.toLowerCase().includes(q)||r.industryCode.includes(q)||matches.some(m=>m.industryCode===r.industryCode));
  if(!selectedIndustry||!list.some(r=>r.industryCode===selectedIndustry))selectedIndustry=list[0]?.industryCode||"";
  tabs.innerHTML=list.map(r=>{
    const prev=previousIndustryRank(r.industryCode,selectedDate);
    const cls=clsByMove(r.industryRank,prev);
    const move=prev==null?"新":`${prev}→${r.industryRank}`;
    return `<button class="tab ${r.industryCode===selectedIndustry?"active":""}" data-code="${r.industryCode}">
      <b class="${cls}">${r.industryRank}. ${r.industryName}</b>
      <small>${r.industryCode}｜${move}</small>
    </button>`;
  }).join("")||`<div class="hint">暂无匹配板块</div>`;
  tabs.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{selectedIndustry=btn.dataset.code;renderTabs();renderTable();btn.scrollIntoView({inline:"center",block:"nearest"});}));
}
function cellFor(date,code,rank){
  const r=rowsByDate(date).find(x=>x.industryCode===code&&x.stockRank===rank);
  if(!r)return `<td class="empty">-</td>`;
  const prev=previousStockRank(code,r.symbol,date);
  const cls=clsByMove(r.stockRank,prev);
  return `<td class="${cls}"><b>${r.name}</b><small>${r.symbol}</small></td>`;
}
function renderTable(){
  const ind=industries(selectedDate).find(r=>r.industryCode===selectedIndustry);
  if(!ind){title.textContent="请选择板块";meta.textContent="";tableWrap.innerHTML="";return;}
  title.textContent=`${ind.industryRank}. ${ind.industryName}`;
  meta.textContent=`${ind.industryCode}｜周期 ${ind.cycleStartDate||"-"} → ${selectedDate}｜行业领涨 ${ind.industryScore}｜5日相对 ${ind.industryRel5}%｜强势股 ${ind.industryStrongCount}/${ind.industryTotalCount}`;
  const ds=windowDates(selectedDate);
  let html=`<table><thead><tr><th class="rank-no">身位</th>${ds.map(d=>`<th>${fmtDate(d)}</th>`).join("")}</tr></thead><tbody>`;
  for(let rank=1;rank<=STOCK_TOP;rank++)html+=`<tr><td class="rank-no">${rank}</td>${ds.map(d=>cellFor(d,selectedIndustry,rank)).join("")}</tr>`;
  html+=`</tbody></table>`;
  tableWrap.innerHTML=html;
  chartPanel.innerHTML=renderLeadershipChart(selectedIndustry,ds);
}
function renderAll(){renderDates();renderTabs();renderTable();}
dateSelect.addEventListener("change",()=>{selectedDate=dateSelect.value;selectedIndustry="";renderAll();});
filterInput.addEventListener("input",()=>{selectedIndustry="";renderTabs();renderTable();});
renderAll();
</script>
</body>
</html>
